[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enkaz"
version = "0.1.0"
description = "Building-level damage assessment from pre/post satellite imagery, with a search-and-rescue priority map."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Emir Tunali" }]
dependencies = [
    "numpy>=1.23",
    "shapely>=2.0",
    "pyproj>=3.4",
    "scipy>=1.9",
    "pillow>=9.0",
]

[project.optional-dependencies]
# Geospatial raster I/O and tabular data (available or pip-installable on Colab).
geo = ["rasterio>=1.3", "pandas>=1.5"]
# GPU training stack; torch is preinstalled on Colab.
train = ["torch>=2.1", "torchvision>=0.16", "timm>=0.9", "scikit-learn>=1.2"]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: test needs internet access (deselected in CI)", "gpu: test needs a CUDA GPU"]
addopts = "-m 'not network and not gpu'"
